<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechFlow – Dashboard</title>


  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            icy: '#A9CEF4',
            iron: '#36494E', 
            ink: '#000000'  
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-icy/20 text-ink dark:bg-ink dark:text-white transition-colors duration-300">
  <div class="flex min-h-screen lg:h-screen lg:overflow-hidden">

    <!-- Overlay do menu mobile -->
    <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/50 lg:hidden"></div>

    <!-- side bar -->
    <aside id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col gap-6 border-r border-icy bg-white p-5 transition-transform duration-300 ease-in-out dark:border-iron dark:bg-ink lg:static lg:translate-x-0">

      <div class="flex items-center justify-between">
        <span class="text-xl font-bold text-iron dark:text-icy">TechFlow</span>
        <button id="closeSidebar" aria-label="Fechar menu"
          class="rounded-lg p-1 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy active:scale-95 dark:hover:bg-iron lg:hidden">
          ✕
        </button>
      </div>

      <nav class="flex flex-col gap-1 text-sm font-medium">
        <a href="#" class="rounded-lg bg-icy px-3 py-2 text-ink transition">Dashboard</a>
        <a href="#" class="rounded-lg px-3 py-2 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy dark:hover:bg-iron">Projetos</a>
        <a href="#" class="rounded-lg px-3 py-2 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy dark:hover:bg-iron">Equipes</a>
        <a href="#" class="rounded-lg px-3 py-2 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy dark:hover:bg-iron">Tarefas</a>
        <a href="#" class="rounded-lg px-3 py-2 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy dark:hover:bg-iron">Configurações</a>
      </nav>

      <!-- Seletor de tema -->
      <div class="mt-auto flex flex-col gap-2">
        <span class="text-xs opacity-70">Tema</span>
        <div class="flex rounded-lg border border-icy p-0.5 text-xs dark:border-iron" role="group" aria-label="Tema">
          <button data-theme="light" class="theme-btn flex-1 rounded-md px-2 py-1 transition focus:outline-none focus:ring-2 focus:ring-icy aria-pressed:bg-iron aria-pressed:text-white dark:aria-pressed:bg-icy dark:aria-pressed:text-ink">Light</button>
          <button data-theme="dark" class="theme-btn flex-1 rounded-md px-2 py-1 transition focus:outline-none focus:ring-2 focus:ring-icy aria-pressed:bg-iron aria-pressed:text-white dark:aria-pressed:bg-icy dark:aria-pressed:text-ink">Dark</button>
          <button data-theme="system" class="theme-btn flex-1 rounded-md px-2 py-1 transition focus:outline-none focus:ring-2 focus:ring-icy aria-pressed:bg-iron aria-pressed:text-white dark:aria-pressed:bg-icy dark:aria-pressed:text-ink">System</button>
        </div>
      </div>
    </aside>


    <div class="flex min-w-0 flex-1 flex-col lg:overflow-hidden">

      <!-- nav bar -->
      <header
        class="sticky top-0 z-20 flex items-center justify-between gap-3 border-b border-icy bg-white px-4 py-3 dark:border-iron dark:bg-ink sm:px-6">

        <button id="openSidebar" aria-label="Abrir menu"
          class="rounded-lg border border-icy p-2 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy active:scale-95 dark:border-iron dark:hover:bg-iron lg:hidden">
         
        </button>

        <h1 class="hidden text-lg font-semibold sm:block">Dashboard</h1>

        <div class="ml-auto flex items-center gap-3">

           <!-- parte  do usuario e dropdown -->
          <div class="relative">
            <button id="userBtn" aria-haspopup="true" aria-expanded="false"
              class="flex items-center gap-2 rounded-lg p-1 transition hover:bg-icy/40 focus:outline-none focus:ring-2 focus:ring-icy active:scale-95 dark:hover:bg-iron">
              <span class="flex h-9 w-9 items-center justify-center rounded-full bg-iron text-sm font-semibold text-white dark:bg-icy dark:text-ink">DT</span>
              <span class="hidden text-left text-sm leading-tight md:block">
                <span class="block font-medium">Davi Toyota</span>
                <span class="block text-xs opacity-70">Desenvolvedor</span>
              </span>
            </button>

            <div id="userMenu"
              class="absolute right-0 mt-2 hidden w-48 flex-col rounded-lg border border-icy bg-white py-1 text-sm shadow-lg dark:border-iron dark:bg-iron">
              <a href="#" class="px-4 py-2 transition hover:bg-icy/40 dark:hover:bg-ink">Meu perfil</a>
              <a href="#" class="px-4 py-2 transition hover:bg-icy/40 dark:hover:bg-ink">Configurações</a>
              <a href="#" class="px-4 py-2 transition hover:bg-icy/40 dark:hover:bg-ink">Sair</a>
            </div>
          </div>
        </div>
      </header>

      <!-- buscar projeto e novo prjeto  -->
      <main class="flex flex-1 flex-col gap-6 p-4 sm:p-6">

        <!-- Pesquisa + ações -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <input id="search" type="search" placeholder="Pesquisar projetos..."
            class="w-full rounded-lg border border-icy bg-white px-4 py-2 text-sm transition focus:border-iron focus:outline-none focus:ring-2 focus:ring-icy dark:border-iron dark:bg-ink dark:focus:border-icy sm:max-w-sm" />

          <div class="flex flex-wrap gap-2">
            
            <button id="newProjectBtn"
              class="open-modal rounded-lg bg-iron px-4 py-2 text-sm font-medium text-white transition duration-200 hover:bg-ink focus:outline-none focus:ring-2 focus:ring-icy active:scale-95 dark:bg-icy dark:text-ink dark:hover:bg-white">
              + Novo projeto
            </button>
          </div>
        </div>

        <!-- cards -->
        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
          <div class="rounded-xl border border-icy bg-white p-5 transition duration-200 hover:-translate-y-1 dark:border-iron dark:bg-iron/40">
            <p class="text-sm opacity-70">Projetos ativos</p>
            <p class="mt-1 text-3xl font-bold">0</p>
          </div>
          <div class="rounded-xl border border-icy bg-white p-5 transition duration-200 hover:-translate-y-1 dark:border-iron dark:bg-iron/40">
            <p class="text-sm opacity-70">Projetos concluídos</p>
            <p class="mt-1 text-3xl font-bold">0</p>
          </div>
          <div class="rounded-xl border border-icy bg-white p-5 transition duration-200 hover:-translate-y-1 dark:border-iron dark:bg-iron/40">
            <p class="text-sm opacity-70">Tarefas pendentes</p>
            <p class="mt-1 text-3xl font-bold">0</p>
          </div>
          <div class="rounded-xl border border-icy bg-white p-5 transition duration-200 hover:-translate-y-1 dark:border-iron dark:bg-iron/40">
            <p class="text-sm opacity-70">Equipes</p>
            <p class="mt-1 text-3xl font-bold">0</p>
          </div>
        </section>


         
  </div>

  <script src="js/app.js"></script>
</body>
</html>
