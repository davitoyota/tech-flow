<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>techflow</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-[#0c0c0e] text-white antialiased min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="h-16 border-b border-zinc-800 bg-[#121212] text-zinc-400 px-4 md:px-8 flex items-center justify-between w-full"> 
    
    <!-- Menu hamburguer que aparece apenas no mobile -->
    <div class="flex items-center"> 
      <button id="toggle-sidebar" class="lg:hidden p-2 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white transition-colors flex items-center justify-center">
        <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
      
    <!-- Busca e Perfil do usuario -->
    <div class="flex items-center gap-6">
      
      <!-- Campo de busca -->
      <div class="relative w-40 sm:w-60">
        <svg xmlns="http://w3.org" class="h-4 w-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" placeholder="Pesquisar projetos..." class="w-full bg-[#18181b] border border-zinc-800 rounded-lg pl-9 pr-4 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition-colors">
      </div>

      <!-- Status -->
      <div class="w-5 h-5 rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.4)] cursor-pointer hover:scale-105 transition-transform"></div>


      <!-- Dropdown Usuario -->
      <div class="relative">
        <button id="user-dropdown-btn" class="flex items-center gap-3 p-1 rounded-xl hover:bg-zinc-800/50 transition-all text-left group">
          <div class="hidden md:block">
            <p class="text-xs font-semibold text-zinc-200 group-hover:text-white transition-colors">Davi Toyota</p>
            <p class="text-[10px] text-zinc-500">Product Designer</p>
          </div>
          <svg xmlns="http://w3.org" class="h-3 w-3 text-zinc-500 group-hover:text-zinc-300 transition-colors pt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Menu suspenso -->
        <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-[#121214] border border-zinc-800 rounded-xl shadow-2xl py-1 z-50">
          <a href="#" class="block px-4 py-2.5 text-xs text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">Meu Perfil</a>
          <a href="#" class="block px-4 py-2.5 text-xs text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">Configurações</a>
          <hr class="border-zinc-800 my-1">
          <a href="#" class="block px-4 py-2.5 text-xs text-red-400 hover:bg-red-950/20 transition-colors">Sair da Conta</a>
        </div>
      </div>

    </div>
  </header>

  <!-- Script local carregado nativamente pelo Vite -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
